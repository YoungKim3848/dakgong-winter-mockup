:root{
  --accent:#0f52c9;--accent-2:#2666d6;--accent-light:#5187e8;--accent-bg:#dce8fc;
  --other:#6b6b6b;--other-bg:#e4e4e4;
  --ink:#1a1a1a;--fg-2:#2a2a2a;--fg-3:#555;--muted:#808080;
  --canvas:#fff;--card:#f5f5f5;--hair:#d0d0d0;--hair-soft:#e8e8e8;--dark:#2a2a2a;--surround:#dcdcdc;
  --sans:"DKPretendard","Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --display:"DKPaperlogy","Paperlogy","DKPretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surround);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-light);outline-offset:2px}
.phone{max-width:430px;margin:0 auto;background:var(--canvas);min-height:100vh;box-shadow:0 20px 60px rgba(0,0,0,.14)}

.mock{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#111;color:#fff;padding:10px 14px 12px}
.mock p{margin:0 0 8px;font-size:12px;opacity:.75}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:6px;padding:6px 4px;cursor:pointer;line-height:1.25;min-height:44px}
.tabs b{display:block;font-size:14px}
.tabs small{font-size:11px;opacity:.75}
.tabs button[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}

.sec{padding:32px 20px 36px}
.label{margin:0 0 6px;color:var(--accent);font-size:15px}
.h2{margin:0;font:700 26px/1.28 var(--display);letter-spacing:-.4px}
.sub{margin:6px 0 0;color:var(--fg-3);font-size:15px}

/* 필터 칩 */
.q{margin:22px 0 0}
.q__t{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--fg-2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--hair);background:var(--canvas);border-radius:999px;padding:0 16px;min-height:40px;font-size:15px;font-weight:700;cursor:pointer;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips--scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.chips--scroll::-webkit-scrollbar{display:none}
.chips--scroll .chip{flex:none;padding:0 12px}
.chips--scroll .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}

/* 결과 카드 */
.cards{display:grid;gap:10px;margin-top:20px}
.pcard{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--hair-soft);background:var(--canvas);padding:14px 16px;cursor:pointer;border-radius:8px}
.pcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard__no{grid-row:span 2;font:700 26px/1 var(--sans)}
.pcard__name{font:700 16px/1.35 var(--sans)}
.pcard__date{font-size:13px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.pcard__wk{grid-row:span 2;font:700 22px/1 var(--display);color:var(--accent)}
.pcard .rec{font:700 10px/1 var(--sans);color:#fff;background:var(--accent);padding:3px 5px;border-radius:3px;margin-left:4px;vertical-align:2px}
.empty{margin-top:20px;padding:18px;background:var(--card);font-size:14px;color:var(--fg-3)}

/* 달력 */
.calwrap{margin-top:22px}
.calhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.calhead b{font:700 20px/1.3 var(--sans)}
.calhead span{font-size:14px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12px;color:var(--fg-3);margin:10px 0 2px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.months{display:grid;gap:18px;margin-top:10px}
.month h4{margin:0 0 6px;font:700 15px/1 var(--sans)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0}
.dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.dow:first-child{color:#c1272d}
.day{position:relative;height:34px;display:grid;place-items:center;font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.day.off{color:#c8c8c8}
.day.on{color:#fff;font-weight:700}
.day.on::before{content:"";position:absolute;inset:3px 0;z-index:-1}
.day{z-index:0}
.day.K::before{background:var(--kcol)}
.day.P::before{background:var(--pcol)}
.day.KP::before{background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%)}
.day.start::before{left:3px;border-radius:17px 0 0 17px}
.day.end::before{right:3px;border-radius:0 17px 17px 0}
.day.start.end::before{border-radius:17px}
.day.flag::after{content:attr(data-flag);position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--hair);border-radius:3px;padding:0 3px;line-height:13px;white-space:nowrap;z-index:2}

/* C안 막대 */
.bars{margin-top:18px}
.brow{display:grid;grid-template-columns:34px 1fr;align-items:center;width:100%;border:0;background:transparent;padding:0;cursor:pointer;height:44px}
.brow__no{font:700 18px/1 var(--sans);text-align:left}
.btrack{position:relative;height:100%;background:linear-gradient(90deg,transparent 0 var(--j),#f1f1f1 var(--j) var(--f),transparent var(--f))}
.bbar{position:absolute;top:10px;height:24px;border-radius:4px;color:#fff;font:700 11px/24px var(--sans);text-align:center;overflow:hidden}
.brow[aria-pressed="true"] .bbar{box-shadow:0 0 0 2px var(--canvas),0 0 0 4px var(--accent)}
.baxis{display:grid;grid-template-columns:34px 1fr;font-size:12px;font-weight:700;color:var(--fg-3)}
.baxis div{position:relative;height:18px}
.baxis div span{position:absolute}

.daily{margin:26px 0 0;display:flex;align-items:center;gap:12px;padding:16px;background:var(--card);text-decoration:none;color:var(--ink)}
.daily b{display:block;font-size:15px}
.daily small{font-size:13px;color:var(--fg-3)}
.daily i{margin-left:auto;font-style:normal;font-weight:700;color:var(--accent);white-space:nowrap}
.note{margin:0;padding:16px 20px 28px;font-size:12px;color:var(--muted);background:var(--canvas)}
</style></head><body>

  </div>
  <p class="note">A·B·C는 비교용 시안이며, 고르신 한 가지만 실제 모집요강 화면에 들어갑니다. 일과표는 홈페이지 기존 페이지로 연결합니다.</p>
</div>

<script>
const C = {"main": "K", "rec": {"no": 9, "who": "중3"}, "all": [5, 6, 7, 8, 9], "programs": {"1": {"name": "한국 2주 + 필리핀 8주", "short": "한국+필리핀", "total": "10주", "who": "초1 ~ 초6", "legs": [["K", "12.19", "1.3", "2주"], ["P", "1.4", "2.25", "8주"]], "place": "한국+필리핀"}, "2": {"name": "한국 6주 + 필리핀 4주", "short": "한국+필리핀", "total": "10주", "who": "초1 ~ 중3", "legs": [["K", "12.19", "2.1", "6주"], ["P", "2.2", "2.25", "4주"]], "place": "한국+필리핀"}, "3": {"name": "한국 4주 + 필리핀 4주", "short": "한국+필리핀", "total": "8주", "who": "초1 ~ 중3", "legs": [["K", "1.3", "2.1", "4주"], ["P", "2.2", "2.25", "4주"]], "place": "한국+필리핀"}, "4": {"name": "필리핀 4주 + 한국 4주", "short": "필리핀+한국", "total": "8주", "who": "초1 ~ 중3", "legs": [["P", "1.4", "2.2", "4주"], ["K", "2.2", "2.27", "4주"]], "place": "한국+필리핀"}, "5": {"name": "한국 1월 4주", "short": "1월", "total": "4주", "who": "중등수학이 가능한 초6 ~ 고등부", "legs": [["K", "1.3", "1.31", "4주"]], "place": "한국만"}, "6": {"name": "한국 2월 4주", "short": "2월", "total": "4주", "who": "중등수학이 가능한 초6 ~ 고등부", "legs": [["K", "2.1", "2.27", "4주"]], "place": "한국만"}, "7": {"name": "한국 6주", "short": "12월~1월", "total": "6주", "who": "중등수학이 가능한 초6 ~ 고등부", "legs": [["K", "12.19", "2.1", "6주"]], "place": "한국만"}, "8": {"name": "한국 8주", "short": "1월~2월", "total": "8주", "who": "중등수학이 가능한 초6 ~ 고등부", "legs": [["K", "1.3", "2.27", "8주"]], "place": "한국만"}, "9": {"name": "한국 10주", "short": "전 기간", "total": "10주", "who": "중등수학이 가능한 초6 ~ 고등부", "legs": [["K", "12.19", "2.27", "10주"]], "place": "한국만"}, "10": {"name": "한국 2주 + 필리핀 4주", "short": "한국+필리핀", "total": "6주", "who": "초1 ~ 중3", "legs": [["K", "12.19", "1.3", "2주"], ["P", "1.4", "2.2", "4주"]], "place": "한국+필리핀"}, "11": {"name": "필리핀 1월 4주", "short": "1월", "total": "4주", "who": "초1 ~ 중3", "legs": [["P", "1.4", "2.2", "4주"]], "place": "필리핀만"}, "12": {"name": "필리핀 2월 4주", "short": "2월", "total": "4주", "who": "초1 ~ 중3", "legs": [["P", "2.2", "2.25", "4주"]], "place": "필리핀만"}, "13": {"name": "필리핀 8주", "short": "1월~2월", "total": "8주", "who": "초1 ~ 중3", "legs": [["P", "1.4", "2.25", "8주"]], "place": "필리핀만"}}};
const $ = id => document.getElementById(id);
const NO = n => String.fromCharCode(0x245F + n);
const NAME = {K:'한국', P:'필리핀'};
const D = s => { const [m,d] = s.split('.').map(Number); return new Date(Date.UTC(m >= 12 ? 2026 : 2027, m-1, d)); };
const fmt = s => s.replace('.', '/');
let view = 'A', sel = C.rec.no, fWeeks = null, fPlace = C.places ? C.programs[C.rec.no].place : null;

document.documentElement.style.setProperty('--kcol', C.main === 'K' ? 'var(--accent)' : 'var(--other)');
document.documentElement.style.setProperty('--pcol', C.main === 'P' ? 'var(--accent)' : 'var(--other)');

function calendar(n){
  const p = C.programs[n];
  const dayMap = {};
  p.legs.forEach(([c,s,e], li) => {
    for (let t = D(s); t <= D(e); t = new Date(t.getTime() + 864e5)){
      const k = t.toISOString().slice(0,10);
      (dayMap[k] ||= []).push({c, start: +t === +D(s), end: +t === +D(e), li});
    }
  });
  const months = [[2026,11,'12월'],[2027,0,'1월'],[2027,1,'2월']];
  const col = c => c === C.main ? 'var(--accent)' : 'var(--other)';
  let h = `<div class="calhead"><b>${NO(n)} ${p.name}</b><span>${p.legs.map(([c,s,e]) => `${NAME[c]} ${fmt(s)}–${fmt(e)}`).join(' → ')}</span></div>
    <div class="legend">${[...new Set(p.legs.map(l => l[0]))].map(c => `<span><i style="background:${col(c)}"></i>${NAME[c]}</span>`).join('')}<span>총 <b>${p.total}</b> · 대상 ${p.who}</span></div><div class="months">`;
  for (const [y,m,label] of months){
    const first = new Date(Date.UTC(y,m,1)).getUTCDay(), last = new Date(Date.UTC(y,m+1,0)).getUTCDate();
    h += `<div class="month"><h4>${y}년 ${label}</h4><div class="grid">${'일월화수목금토'.split('').map(d => `<span class="dow">${d}</span>`).join('')}`;
    for (let i = 0; i < first; i++) h += '<span class="day"></span>';
    for (let d = 1; d <= last; d++){
      const k = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, ev = dayMap[k];
      if (!ev){ h += `<span class="day off">${d}</span>`; continue; }
      let cls = 'day on', style = '', flag = '';
      if (ev.length > 1){ cls += ' KP'; style = `--c1:${col(ev[0].c)};--c2:${col(ev[1].c)}`; flag = '이동'; }
      else cls += ' ' + ev[0].c;
      if (ev.some(x => x.start) && !(ev.length > 1)) { cls += ' start'; if (ev[0].li === 0) flag = '시작'; }
      if (ev.some(x => x.end) && !(ev.length > 1)) { cls += ' end'; if (ev[0].li === p.legs.length - 1) flag = '종료'; }
      const dow = new Date(Date.UTC(y,m,d)).getUTCDay();
      if (dow === 0) cls += ' start'; if (dow === 6) cls += ' end';
      if (flag) cls += ' flag';
      h += `<span class="${cls}" style="${style}" ${flag ? `data-flag="${flag}"` : ''}>${d}</span>`;
    }
    h += '</div></div>';
  }
  return h + '</div>';
}

function draw(){
  const P = C.programs;
  let picker = '';
  if (view === 'A'){
    $('title').textContent = '우리 아이에게 맞는 일정은?';
    $('sub').textContent = '조건을 고르면 맞는 일정만 남아요.';

  if (C.places){
    picker += `<div class="q"><p class="q__t">어디에서 지내나요?</p><div class="fchips">${C.places.map(pl => `<button type="button" class="fchip" data-place="${pl}" aria-pressed="${fPlace === pl}">${pl}</button>`).join('')}</div></div>`;
  }
  const pool = C.all.filter(n => !fPlace || P[n].place === fPlace);
  const weeksAll = [...new Set(pool.map(n => P[n].total))].sort((a,b) => parseInt(a)-parseInt(b));
  if (fWeeks && !weeksAll.includes(fWeeks)) fWeeks = null;
  picker += `<div class="q"><p class="q__t">방학 중 몇 주를 보낼까요?</p><div class="fchips">${[null,...weeksAll].map(w => `<button type="button" class="fchip" data-weeks="${w ?? ''}" aria-pressed="${fWeeks === w}">${w ?? '전체'}</button>`).join('')}</div></div>`;
  const list = pool.filter(n => !fWeeks || P[n].total === fWeeks);
  if (!list.includes(sel)) sel = list.includes(C.rec.no) ? C.rec.no : list[0];
  picker += `<div class="cards">${list.map(n => `<button type="button" class="pcard" data-n="${n}" aria-pressed="${n===sel}">
    <span class="pcard__no">${NO(n)}</span><span class="pcard__name">${P[n].name}${n===C.rec.no?`<span class="rec">${C.rec.who} 추천</span>`:''}</span>
    <span class="pcard__wk">${P[n].total}</span><span class="pcard__date">${P[n].legs.map(([c,s,e]) => `${fmt(s)}–${fmt(e)}`).join(' · ')}</span></button>`).join('')}</div>`;
  } else if (view === 'B'){
    $('title').textContent = '일정을 골라 달력으로 확인하세요';
    $('sub').textContent = '번호를 누르면 달력에 기간이 칠해져요.';
    picker = `<div class="q"><div class="chips chips--scroll">${C.all.map(n => `<button type="button" class="chip" data-n="${n}" aria-pressed="${n===sel}">${NO(n)} ${P[n].total}</button>`).join('')}</div></div>`;
  } else {
    $('title').textContent = '원하는 기간을 눌러보세요';
    $('sub').textContent = '막대를 누르면 아래 달력에 날짜가 표시돼요.';
    const Y0 = Date.UTC(2026,11,19), SP = Date.UTC(2027,1,27) - Y0, pc = t => (t - Y0) / SP * 100;
    const j = pc(Date.UTC(2027,0,1)), f = pc(Date.UTC(2027,1,1));
    picker = `<div class="bars"><div class="baxis"><i></i><div><span style="left:0">12월</span><span style="left:${j}%">1월</span><span style="left:${f}%">2월</span></div></div>` +
      C.all.map(n => `<button type="button" class="brow" data-n="${n}" aria-pressed="${n===sel}" aria-label="${NO(n)} ${P[n].name}"><span class="brow__no">${NO(n)}</span>
        <span class="btrack" style="--j:${j}%;--f:${f}%">${P[n].legs.map(([c,s,e,w]) => `<i class="bbar" style="left:${pc(+D(s))}%;width:${pc(+D(e))-pc(+D(s))}%;background:${c===C.main?(n===sel?'var(--accent)':'var(--dark)'):(n===sel?'var(--accent-light)':'#a9a9a9')}">${w}</i>`).join('')}</span></button>`).join('') + '</div>';
  }
  $('picker').innerHTML = picker;
  $('cal').innerHTML = calendar(sel);
  $('picker').querySelectorAll('[data-n]').forEach(b => b.onclick = () => { sel = +b.dataset.n; draw(); });
  $('picker').querySelectorAll('[data-weeks]').forEach(b => b.onclick = () => { fWeeks = b.dataset.weeks || null; draw(); });
  $('picker').querySelectorAll('[data-place]').forEach(b => b.onclick = () => { fPlace = b.dataset.place; fWeeks = null; draw(); });
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  view = b.dataset.v; document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); draw();
});
draw();
</script>
</body></html>
